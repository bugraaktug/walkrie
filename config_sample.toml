# walkrie config
# Pass path to this file as the only CLI arg: ./walkrie -f -c /path/to/config.toml

[app]
log_level = "info"   # trace / debug / info / warn / error / critical
log_file  = "/var/log/walkrie/walkrie.log"
log_max_size_mb  = 10
log_max_files    = 5

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "cdc_slot"
publication = "test_pub"

[[sink]]
host     	= "localhost"
port     	= "5432"
dbname   	= "qdb"
user     	= "quser"
password 	= "quser1234"
table    	= "public.test_embeddings"
embed_column 	= "embedding"

 [[sink.table_mapping]]
 source_table = "test_table"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

[embedding]
provider   = "llama"
# If llama is used as provider then 
# place your GGUF model file in /var/lib/walkrie/models/ before starting
# the service — this directory is created automatically but is NOT
# populated by the package (model files are large and licensed
# separately). See README.md for download instructions.
model_path = "/var/lib/walkrie/models/bge-m3-Q4_K_M.gguf"
api_key    = ""
dimensions = 1024
n_threads  = 4
n_ctx      = 512
