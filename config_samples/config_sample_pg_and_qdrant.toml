# walkrie config
# Two sources fanning into two sinks of DIFFERENT types (pgvector +
# qdrant) — the dual-write case that motivated the shared-embedding-provider
# dedup fix: both sinks embed the same source rows, so create_initialized_
# embedding_provider()'s CachingEmbeddingProvider wrapper avoids re-running
# the model twice per row.
#
# Before starting walkrie, create the Qdrant collection yourself — QdrantSink
# verifies it exists and checks the vector size, it does not auto-create:
#
#   curl -X PUT http://localhost:6333/collections/test_embeddings_dual \
#     -H "Content-Type: application/json" \
#     -d '{"vectors": {"size": 1024, "distance": "Cosine"}}'
#
# Usage: ./walkrie -f -c /path/to/config.toml

[app]
log_level = "info"   # trace / debug / info / warn / error / critical
log_file  = "/tmp/logs/walkrie.log"
log_max_size_mb  = 10
log_max_files    = 5
batch_size	 = 4
batch_timeout_ms = 50

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "cdc_slot"
publication = "test_pub"

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "pgcdc_slot"
publication = "pgcdc_pub"

[[sink]]
type 	    = "pgvector"
host     	= "localhost"
port     	= "5432"
dbname   	= "qdb"
user     	= "quser"
password 	= "quser1234"
table    	= "public.test_embeddings_dual"
embed_column 	= "embedding"

 [[sink.table_mapping]]
 source_table = "test_table"
 discriminator_column = "category"
 discriminator_label  = "test"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

 [[sink.table_mapping]]
 source_table = "documents"
 discriminator_column = "category"
 discriminator_label  = "documents"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "body"
    sink_column   = "item_name"
    role          = "embed"

[[sink]]
type       = "qdrant"
url        = "http://localhost:6333"
api_key    = ""
collection = "test_embeddings_dual"

 [[sink.table_mapping]]
 source_table = "test_table"
 discriminator_column = "category"
 discriminator_label  = "test"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

 [[sink.table_mapping]]
 source_table = "documents"
 discriminator_column = "category"
 discriminator_label  = "documents"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "body"
    sink_column   = "item_name"
    role          = "embed"


[embedding]
provider   = "llama"
model_path = "/home/debian/models/bge-m3/bge-m3-Q4_K_M.gguf"
api_key    = ""
dimensions = 1024
n_threads  = 4
n_ctx      = 512
