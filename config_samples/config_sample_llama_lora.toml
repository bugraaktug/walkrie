# walkrie config — llama.cpp embedding provider with a LoRA task adapter
# (e.g. jina-embeddings-v3's retrieval.passage adapter, for multilingual text
# such as Japanese or Turkish CVs — see gaianet/jina-embeddings-v3-GGUF)
# Usage: ./walkrie -f -c /path/to/config.toml

[app]
log_level = "debug"   # trace / debug / info / warn / error / critical
log_file  = "/tmp/logs/walkrie.log"
log_max_size_mb  = 10
log_max_files    = 5

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "cdc_slot"
publication = "test_pub"

[[sink]]
host     	= "localhost"
port     	= "5432"
dbname   	= "qdb"
user     	= "quser"
password 	= "quser1234"
table    	= "public.test_embeddings"
embed_column 	= "embedding"

 [[sink.table_mapping]]
 source_table = "test_table"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

[embedding]
provider   = "llama"
model_path = "/home/debian/models/jina-embeddings-v3/jina-embeddings-v3-Q4_K_M.gguf"
# retrieval.passage adapter — for embedding rows being indexed (this pipeline).
# A downstream query-side tool (e.g. candidate_search_tool.cpp) needs its own
# [embedding] config pointing at the same model_path but the retrieval.query
# adapter instead — one lora_path per pipeline, not per call.
lora_path  = "/home/debian/models/jina-embeddings-v3/lora-retrieval.passage-jina-embeddings-v3-f16.gguf"
lora_scale = 1.0
api_key    = ""
dimensions = 1024
n_threads  = 4
n_ctx      = 512
