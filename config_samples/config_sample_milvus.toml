# Before starting walkrie, create the Milvus collection yourself — MilvusSink
# verifies it exists and checks the vector field's dim, it does not
# auto-create one. The collection's primary-key and vector fields are
# auto-discovered by name (no config needed for them, same idea as Qdrant's
# fixed unnamed vector slot) — MilvusSink always writes the hashed row id
# there and the embedding there, regardless of what they're called. The
# `id`/`embed` roles below name SEPARATE scalar fields that hold the
# *readable* source id/text (mirrors QdrantSink's payload item_id/item_name)
# — they must NOT collide with the pk/vector field names, MilvusSink::init()
# rejects a config that does:
#
#   from pymilvus import MilvusClient, DataType
#   client = MilvusClient(uri="http://localhost:19530")
#   schema = client.create_schema(auto_id=False, enable_dynamic_field=False)
#   schema.add_field("id", DataType.INT64, is_primary=True)       # <<< hashed row id, auto-discovered
#   schema.add_field("vector", DataType.FLOAT_VECTOR, dim=1024)   # <<< embedding, auto-discovered
#   schema.add_field("item_id", DataType.VARCHAR, max_length=128)   # readable source id
#   schema.add_field("item_name", DataType.VARCHAR, max_length=4096) # readable source text
#   schema.add_field("category", DataType.VARCHAR, max_length=128)   # discriminator
#   index_params = client.prepare_index_params()
#   index_params.add_index(field_name="vector", metric_type="COSINE")
#   client.create_collection(collection_name="test_embeddings", schema=schema, index_params=index_params)

[app]
log_level = "debug"   # trace / debug / info / warn / error / critical
log_file  = "/tmp/logs/walkrie.log"
log_max_size_mb  = 10
log_max_files    = 5
batch_size	 = 4
batch_timeout_ms = 50

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "cdc_slot_milvus"
publication = "test_pub"

[[sink]]
type       = "milvus"
url        = "http://localhost:19530"
token      = ""                # optional; "user:pass" or an API key — omit if auth is disabled
db_name    = ""                # optional; server default db used when empty
collection = "test_embeddings"

 [[sink.table_mapping]]
 source_table = "test_table"
 discriminator_column = "category"
 discriminator_label  = "test"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

[embedding]
provider   = "llama"
model_path = "/home/debian/models/bge-m3/bge-m3-Q4_K_M.gguf"
api_key    = ""
dimensions = 1024
n_threads  = 4
n_ctx      = 512
