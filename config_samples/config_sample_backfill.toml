# walkrie config
# Usage: ./walkrie -f -c /path/to/config.toml
#
# Backfill scenario: scans pre-existing rows into the sink on first-ever slot
# creation (see issue #1 / WLK-0001). Flipping `backfill` on for an
# already-running source (existing slot) has no retroactive effect.

[app]
log_level = "debug"   # trace / debug / info / warn / error / critical
log_file  = "/tmp/logs/walkrie.log"
log_max_size_mb  = 10
log_max_files    = 5
backfill_dir     = "/tmp/walkrie_backfill"  # one SQLite staging file per source with backfill = true

[[source]]
host        = "localhost"
port        = "5432"
dbname      = "qdb"
user        = "quser"
password    = "quser1234"
slot_name   = "cdc_backfill_slot"
publication = "test_pub"
backfill    = true

[[sink]]
host     	= "localhost"
port     	= "5432"
dbname   	= "qdb"
user     	= "quser"
password 	= "quser1234"
table    	= "public.test_embeddings"
embed_column 	= "embedding"

 [[sink.table_mapping]]
 source_table = "test_table"

    [[sink.table_mapping.columns]]
    source_column = "id"
    sink_column   = "item_id"
    role          = "id"

    [[sink.table_mapping.columns]]
    source_column = "name"
    sink_column   = "item_name"
    role          = "embed"

[embedding]
provider   = "llama"
model_path = "/home/debian/models/bge-m3/bge-m3-Q4_K_M.gguf"
api_key    = ""
dimensions = 1024
n_threads  = 4
n_ctx      = 512
